name: Render home tour

# The daily build writes tours/specs/<date>_T.json (status "new") and pushes. This downloads the
# edited tour from Google Drive, adds the town/county title and the business card end frame,
# uploads the MP4s to the "tours" release and commits the cover + preview images.
on:
  push:
    paths:
      - "tours/specs/**"
  workflow_dispatch:

concurrency:
  group: tour-render
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install pillow numpy gdown google-api-python-client google-auth
      - name: Render
        env:
          GH_TOKEN: ${{ github.token }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: python3 tours/render_from_drive.py
      - name: Instagram music candidates
        if: always()
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: pip install requests -q && python3 tours/audio_candidates.py || true
      - name: Save results
        if: always()
        run: |
          git config user.name "nj-dream-home-publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add tours
          git diff --cached --quiet && exit 0
          git commit -q -m "tours: rendered $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
