name: Publish approved posts

# Free auto-publisher (replaces Metricool). GitHub's own schedule only fires every 2 to 4 hours on this
# repo, so each run now STAYS ON for about 5.5 hours, checking the queue every 4 minutes (posts go out
# on the minute), then starts the next run itself. The schedule below is only a backup that restarts
# the chain if it ever breaks. Only one run works at a time (concurrency), so nothing double-posts.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Publish just this queue item id now (testing)"
        required: false
  push:
    paths:
      - "queue/**"

concurrency:
  group: publisher
  cancel-in-progress: false

permissions:
  contents: write
  actions: write     # lets the run start the next run (keep-alive)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # the latest queue, not the commit the schedule fired on
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publish due posts
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          git config user.name "nj-dream-home-publisher"
          git config user.email "publisher@users.noreply.github.com"
          if [ -n "$ONLY" ]; then
            python3 publisher/publish.py --only "$ONLY" --force
            exit $?
          fi
          end=$(( $(date +%s) + 330*60 ))          # stay on ~5.5 h (job limit is 6 h)
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --rebase origin main || true  # pick up newly approved posts
            python3 publisher/publish.py || echo "::warning::some items failed (see queue files)"
            sleep 240
          done
      - name: Start the next run (keep-alive)
        if: ${{ always() && !github.event.inputs.only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main --repo "${{ github.repository }}"
